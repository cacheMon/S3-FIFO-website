{% extends "base.html" %}

<!-- Custom front matter -->
{% block extrahead %}

  <!-- Page title for link previews: the site name, plus the page on inner pages -->
  {% set title = config.site_name %}
  {% if page and page.title and not page.is_homepage %}
    {% set title = config.site_name ~ " - " ~ page.title | striptags %}
  {% endif %}

  <!-- Open Graph tags; the image needs an absolute URL -->
  {% set image = config.site_url ~ 'assets/images/social-card.png' %}
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{ title }}" />
  <meta property="og:description" content="{{ config.site_description }}" />
  <meta property="og:url" content="{{ page.canonical_url }}" />
  <meta property="og:image" content="{{ image }}" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@cachemon_org" />

  <!-- google-site-verification meta-tag -->
  <meta name="google-site-verification" content="-Rj8YMCn9uu5IwOFdC-WfAzXp4ZOMJtYKxU40ZgcJIU" />
  <!-- Inter and JetBrains Mono, as variable fonts; extra.css sets them as the theme fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&family=JetBrains+Mono:wght@400..700&display=swap">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MZCBZV7YYN"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-MZCBZV7YYN');
  </script>

  <!-- Default Statcounter code for S3FIFO https://s3fifo.com -->
  <script type="text/javascript">
    var sc_project=12908806;
    var sc_invisible=1;
    var sc_security="2bab17d3";
  </script>
  <script type="text/javascript"
    src="https://www.statcounter.com/counter/counter.js"
    async></script>
  <noscript><div class="statcounter"><a title="website
    statistics" href="https://statcounter.com/"
    target="_blank"><img class="statcounter"
    src="https://c.statcounter.com/12908806/0/2bab17d3/1/"
    alt="website statistics"
    referrerPolicy="no-referrer-when-downgrade"></a></div></noscript>
  <!-- End of Statcounter Code -->

{% endblock %}
