# Project information
site_name: "S3-FIFO: Simple, scalable and efficient caching"
site_description: >-
  Simple, scalable and efficient caching with S3-FIFO
site_url: https://s3fifo.com/

watch:
  - material
# Repository
# repo_name: cacheMon/S3-FIFO-website
# repo_url: https://github.com/cacheMon/S3-FIFO-website


# Configuration
theme:
  name: material
  custom_dir: material
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    # - content.code.select
    # - content.tabs.link
    - content.tooltips
    # - header.autohide
    # - navigation.expand
    - navigation.footer
    - navigation.indexes
    # - navigation.instant
    # - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    # - toc.integrate
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  # Inter and JetBrains Mono are loaded in material/main.html
  font: false
  favicon: assets/images/logos/s3fifo-logo1.svg
  logo: assets/images/logos/s3fifo-logo1.svg
  # icon:
  #   logo: logo

# Plugins
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true
  - blog:

# Hooks
# hooks:
#   - material/.overrides/hooks/translations.py

# Customization
extra:
  # Shown in the header in place of the long site name
  short_name: S3-FIFO
  annotate:
    json: [.s2]
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY
  social:
    - icon: fontawesome/solid/house
      link: https://cachemon.org
      name: cacheMon
    - icon: fontawesome/brands/github
      link: https://github.com/cacheMon
      name: cacheMon on GitHub
    - icon: fontawesome/brands/slack
      link: https://join.slack.com/t/cachemon/shared_invite/zt-20pjil08z-f9d1Ui~p1gfBnsedHP9x8Q
      name: cacheMon on Slack
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/cachemon_org
      name: cacheMon on X
    - icon: fontawesome/solid/envelope
      link: mailto:cachemon.org@gmail.com
      name: Email us

extra_css:
  - stylesheets/extra.css

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:materialx.emoji.to_svg
      emoji_index: !!python/name:materialx.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: cacheMon
      repo: S3-FIFO-website
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Page tree
nav:
  - Home: index.md
  # - Packages:
  #   - packages/index.md
  - Blog:
    - blog/index.md
    - FIFO queues are all you need for cache eviction: blog/posts/S3-FIFO.md
    - the Power of Lazy Promotion and Quick Demotion: blog/posts/QDLP.md